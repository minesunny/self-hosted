name: Gradle Java CI (Self-hosted Demo & Benchmark)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      project_target:
        description: '测试工程规模 / Project Scale'
        required: false
        default: 'spring-petclinic'
        type: choice
        options:
          - 'spring-petclinic'
          - 'demo'
      java_version:
        description: 'JDK 版本 / JDK Version'
        required: false
        default: '17'
        type: choice
        options:
          - '17'
          - '21'
  repository_dispatch:
    types: [manual-gradle-build]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUNNER_TOOL_CACHE: /home/runner/tool-cache

jobs:
  gradle-build:
    runs-on: [self-hosted, linux]
    env:
      RUNNER_TOOL_CACHE: /home/runner/tool-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner Shared Storage & Tool Cache Setup
        run: |
          # 1. 修复挂载卷权限并关联 tool-cache 软链接
          sudo chown -R $(id -u):$(id -g) /home/runner/.m2 /home/runner/tool-cache 2>/dev/null || true
          mkdir -p /home/runner/tool-cache
          mkdir -p /home/runner/_work
          ln -sfn /home/runner/tool-cache /home/runner/_work/_tool 2>/dev/null || true
          mkdir -p "$HOME/.m2" || true
          chmod -R 777 "$HOME/.m2" 2>/dev/null || true
          mkdir -p "$HOME/.gradle"

          # 2. 如果挂载了 gradle-ro-cache，配置 Gradle 本地只读构建缓存
          if [ -d "/home/runner/gradle-ro-cache" ]; then
            echo "Found gradle-ro-cache, configuring Gradle build cache..."
            mkdir -p "$HOME/.gradle/init.d"
            cat > "$HOME/.gradle/init.d/ro-cache.gradle" <<'EOF'
          gradle.settingsEvaluated { settings ->
              settings.buildCache {
                  local {
                      directory = new File('/home/runner/gradle-ro-cache')
                      push = false
                      enabled = true
                  }
              }
          }
          EOF
          fi

          echo "### 💻 Runner 硬件环境与挂载持久卷状态" >> $GITHUB_STEP_SUMMARY
          echo "| 资源/持久挂载 | 状态与详情 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| CPU / 内存 | $(nproc) vCPU / $(free -h | awk '/Mem:/ {print $2}') (空闲: $(free -h | awk '/Mem:/ {print $4}')) |" >> $GITHUB_STEP_SUMMARY
          echo "| 工具缓存 (tool-cache) | $(ls -A /home/runner/tool-cache 2>/dev/null | tr '\n' ' ' || echo '首次挂载空目录') |" >> $GITHUB_STEP_SUMMARY
          echo "| Gradle 只读缓存 (gradle-ro) | $(ls -A /home/runner/gradle-ro-cache 2>/dev/null | head -n 5 | tr '\n' ' ' || echo '未挂载/空') |" >> $GITHUB_STEP_SUMMARY
          echo "| Maven 缓存 (.m2) | $(ls -A /home/runner/.m2 2>/dev/null | head -n 5 | tr '\n' ' ' || echo '未挂载/空') |" >> $GITHUB_STEP_SUMMARY

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version || '17' }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Execute Build (Benchmark or Demo)
        id: run_build
        run: |
          TARGET="${{ inputs.project_target || 'spring-petclinic' }}"
          echo "Selected Target: $TARGET"
          
          if [ "$TARGET" = "spring-petclinic" ]; then
            echo "::group::1. Cloning Spring PetClinic (depth=1)..."
            CLONE_START=$(date +%s)
            git clone --depth 1 https://github.com/spring-projects/spring-petclinic.git petclinic
            CLONE_END=$(date +%s)
            CLONE_TIME=$((CLONE_END - CLONE_START))
            echo "Clone time: ${CLONE_TIME}s"
            echo "::endgroup::"
            
            cd petclinic
            chmod +x gradlew
            
            echo "::group::2. Compiling, Testing and Packaging with Gradle..."
            BUILD_START=$(date +%s)
            # 排除依赖外置 Postgres/MySQL 容器的两个 integration test，其余 79 个 Spring 核心测试正常执行
            ./gradlew build --no-daemon -x checkFormatAot -x checkFormatAotTest -Dspring.docker.compose.enabled=false \
              --exclude-task :postgresIntegrationTest --exclude-task :mysqlIntegrationTest || \
            ./gradlew bootJar --no-daemon -x checkFormatAot -x checkFormatAotTest
            
            BUILD_END=$(date +%s)
            BUILD_TIME=$((BUILD_END - BUILD_START))
            TOTAL_TIME=$((BUILD_END - CLONE_START))
            echo "Build time: ${BUILD_TIME}s"
            echo "::endgroup::"
            
            JAR_FILE=$(ls build/libs/*.jar | grep -v 'plain' | head -n1 || ls build/libs/*.jar | head -n1)
            JAR_SIZE=$(du -sh "$JAR_FILE" | awk '{print $1}')
            
            echo "### 📊 Java 编译性能测试报告 (Spring PetClinic)" >> $GITHUB_STEP_SUMMARY
            echo "| 指标项 | 评测数据 |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| 测试工程 | [Spring PetClinic (Spring Boot 3 + JPA)](https://github.com/spring-projects/spring-petclinic) |" >> $GITHUB_STEP_SUMMARY
            echo "| 代码拉取耗时 | **${CLONE_TIME}s** |" >> $GITHUB_STEP_SUMMARY
            echo "| 编译构建与测试耗时 | **${BUILD_TIME}s** |" >> $GITHUB_STEP_SUMMARY
            echo "| 全流程总耗时 | **${TOTAL_TIME}s** |" >> $GITHUB_STEP_SUMMARY
            echo "| 生成产物大小 | **${JAR_SIZE}** ($JAR_FILE) |" >> $GITHUB_STEP_SUMMARY
            
            cd ..
            echo "ARTIFACT_PATH=petclinic/build/libs" >> $GITHUB_ENV
          else
            echo "::group::Running Lightweight Demo Project..."
            BUILD_START=$(date +%s)
            mkdir -p gradle-demo
            cat > gradle-demo/settings.gradle <<'EOF'
          rootProject.name = 'gradle-demo'
          EOF
            cat > gradle-demo/build.gradle <<'EOF'
          plugins {
              id 'java'
              id 'application'
          }
          version = '1.0'
          repositories {
              mavenCentral()
          }
          application {
              mainClass = 'demo.App'
          }
          dependencies {
              testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
          }
          test {
              useJUnitPlatform()
          }
          jar {
              manifest {
                  attributes 'Main-Class': 'demo.App'
              }
          }
          EOF
            mkdir -p gradle-demo/src/main/java/demo
            cat > gradle-demo/src/main/java/demo/App.java <<'EOF'
          package demo;
          public class App {
              public static void main(String[] args) {
                  System.out.println("Gradle demo app running on self-hosted runner");
              }
          }
          EOF
            mkdir -p gradle-demo/src/test/java/demo
            cat > gradle-demo/src/test/java/demo/AppTest.java <<'EOF'
          package demo;
          import org.junit.jupiter.api.Test;
          import static org.junit.jupiter.api.Assertions.*;
          public class AppTest {
              @Test
              void smoke() {
                  assertTrue(true);
              }
          }
          EOF
            cd gradle-demo
            gradle clean build --no-daemon
            JAR=$(ls build/libs/*.jar | head -n1)
            java -jar $JAR
            cd ..
            BUILD_END=$(date +%s)
            DURATION=$((BUILD_END - BUILD_START))
            echo "### 📊 Java Demo 构建报告" >> $GITHUB_STEP_SUMMARY
            echo "| 全流程耗时 | **${DURATION}s** |" >> $GITHUB_STEP_SUMMARY
            echo "ARTIFACT_PATH=gradle-demo/build/libs" >> $GITHUB_ENV
            echo "::endgroup::"
          fi

      - name: Upload Gradle build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-output
          path: ${{ env.ARTIFACT_PATH || 'README.md' }}
