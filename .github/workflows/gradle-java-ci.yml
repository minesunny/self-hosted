name: Gradle Java CI (Self-hosted Demo & Benchmark)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      project_target:
        description: '测试工程规模 / Project Scale'
        required: false
        default: 'spring-petclinic'
        type: choice
        options:
          - 'spring-petclinic'
          - 'demo'
      java_version:
        description: 'JDK 版本 / JDK Version'
        required: false
        default: '17'
        type: choice
        options:
          - '17'
          - '21'
  repository_dispatch:
    types: [manual-gradle-build]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gradle-build:
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner System Resources
        run: |
          echo "### 💻 Runner 硬件环境与系统资源" >> $GITHUB_STEP_SUMMARY
          echo "| 硬件指标 | 配置详情 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| CPU 核心数 | $(nproc) vCPU |" >> $GITHUB_STEP_SUMMARY
          echo "| 内存总量 (可用) | $(free -h | awk '/Mem:/ {print $2}') (空闲: $(free -h | awk '/Mem:/ {print $4}')) |" >> $GITHUB_STEP_SUMMARY
          echo "| 根分区磁盘 (可用) | $(df -h / | awk 'NR==2 {print $2}') (可用: $(df -h / | awk 'NR==2 {print $4}')) |" >> $GITHUB_STEP_SUMMARY
          echo "| 操作系统与内核 | $(uname -sr) |" >> $GITHUB_STEP_SUMMARY

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version || '17' }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Execute Build (Benchmark or Demo)
        id: run_build
        run: |
          TARGET="${{ inputs.project_target || 'spring-petclinic' }}"
          echo "Selected Target: $TARGET"
          
          if [ "$TARGET" = "spring-petclinic" ]; then
            echo "::group::1. Cloning Spring PetClinic (depth=1)..."
            CLONE_START=$(date +%s)
            git clone --depth 1 https://github.com/spring-projects/spring-petclinic.git petclinic
            CLONE_END=$(date +%s)
            CLONE_TIME=$((CLONE_END - CLONE_START))
            echo "Clone time: ${CLONE_TIME}s"
            echo "::endgroup::"
            
            cd petclinic
            chmod +x gradlew
            
            echo "::group::2. Compiling and Testing with Gradle Wrapper..."
            BUILD_START=$(date +%s)
            ./gradlew build --no-daemon -x checkFormatAot -x checkFormatAotTest
            BUILD_END=$(date +%s)
            BUILD_TIME=$((BUILD_END - BUILD_START))
            TOTAL_TIME=$((BUILD_END - CLONE_START))
            echo "Build time: ${BUILD_TIME}s"
            echo "::endgroup::"
            
            JAR_FILE=$(ls build/libs/*.jar | grep -v 'plain' | head -n1 || ls build/libs/*.jar | head -n1)
            JAR_SIZE=$(du -sh "$JAR_FILE" | awk '{print $1}')
            
            echo "### 📊 Java 编译性能测试报告 (Spring PetClinic)" >> $GITHUB_STEP_SUMMARY
            echo "| 指标项 | 评测数据 |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| 测试工程 | [Spring PetClinic (Spring Boot 3 + JPA)](https://github.com/spring-projects/spring-petclinic) |" >> $GITHUB_STEP_SUMMARY
            echo "| 代码拉取耗时 | **${CLONE_TIME}s** |" >> $GITHUB_STEP_SUMMARY
            echo "| 编译构建与测试耗时 | **${BUILD_TIME}s** |" >> $GITHUB_STEP_SUMMARY
            echo "| 全流程总耗时 | **${TOTAL_TIME}s** |" >> $GITHUB_STEP_SUMMARY
            echo "| 生成产物大小 | **${JAR_SIZE}** ($JAR_FILE) |" >> $GITHUB_STEP_SUMMARY
            
            cd ..
            echo "ARTIFACT_PATH=petclinic/build/libs" >> $GITHUB_ENV
          else
            echo "::group::Running Lightweight Demo Project..."
            BUILD_START=$(date +%s)
            mkdir -p gradle-demo
            cat > gradle-demo/settings.gradle <<'EOF'
          rootProject.name = 'gradle-demo'
          EOF
            cat > gradle-demo/build.gradle <<'EOF'
          plugins {
              id 'java'
              id 'application'
          }
          version = '1.0'
          repositories {
              mavenCentral()
          }
          application {
              mainClass = 'demo.App'
          }
          dependencies {
              testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
          }
          test {
              useJUnitPlatform()
          }
          jar {
              manifest {
                  attributes 'Main-Class': 'demo.App'
              }
          }
          EOF
            mkdir -p gradle-demo/src/main/java/demo
            cat > gradle-demo/src/main/java/demo/App.java <<'EOF'
          package demo;
          public class App {
              public static void main(String[] args) {
                  System.out.println("Gradle demo app running on self-hosted runner");
              }
          }
          EOF
            mkdir -p gradle-demo/src/test/java/demo
            cat > gradle-demo/src/test/java/demo/AppTest.java <<'EOF'
          package demo;
          import org.junit.jupiter.api.Test;
          import static org.junit.jupiter.api.Assertions.*;
          public class AppTest {
              @Test
              void smoke() {
                  assertTrue(true);
              }
          }
          EOF
            cd gradle-demo
            gradle clean build --no-daemon
            JAR=$(ls build/libs/*.jar | head -n1)
            java -jar $JAR
            cd ..
            BUILD_END=$(date +%s)
            DURATION=$((BUILD_END - BUILD_START))
            echo "### 📊 Java Demo 构建报告" >> $GITHUB_STEP_SUMMARY
            echo "| 全流程耗时 | **${DURATION}s** |" >> $GITHUB_STEP_SUMMARY
            echo "ARTIFACT_PATH=gradle-demo/build/libs" >> $GITHUB_ENV
            echo "::endgroup::"
          fi

      - name: Upload Gradle build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-output
          path: ${{ env.ARTIFACT_PATH }}
